<!doctype html>
<html lang="es" data-modo="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonetix · Páginas web a la medida</title>
<meta name="description" content="Sonetix diseña páginas web personalizadas para tu negocio y se encarga de mantenerlas: hosting, cambios, seguridad y soporte.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20100%20100%22%3E%3Cdefs%3E%3ClinearGradient%20id=%22g%22%20x1=%220%22%20y1=%220%22%20x2=%221%22%20y2=%221%22%3E%3Cstop%20offset=%220%22%20stop-color=%22%23e11d2e%22/%3E%3Cstop%20offset=%221%22%20stop-color=%22%23ff4d4d%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width=%22100%22%20height=%22100%22%20rx=%2224%22%20fill=%22%230a0a0c%22/%3E%3Cg%20fill=%22url(%23g)%22%3E%3Crect%20x=%2216%22%20y=%2240%22%20width=%2211%22%20height=%2220%22%20rx=%225.5%22/%3E%3Crect%20x=%2234%22%20y=%2222%22%20width=%2211%22%20height=%2256%22%20rx=%225.5%22/%3E%3Crect%20x=%2252%22%20y=%2232%22%20width=%2211%22%20height=%2236%22%20rx=%225.5%22/%3E%3Crect%20x=%2270%22%20y=%2242%22%20width=%2211%22%20height=%2216%22%20rx=%225.5%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Playfair+Display:wght@500;600;700&family=Lora:wght@400;500;600&family=Poppins:wght@400;500;600;700&family=Nunito:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --a:#e11d2e; --b:#ff4d4d; --on:#fff;
  --fh:'Space Grotesk',Inter,system-ui,sans-serif; --fb:Inter,system-ui,sans-serif;
  --fs:1; --r:20px; --rb:999px; --k:1;
  --grad:linear-gradient(120deg,var(--a),var(--b));
  --bg:color-mix(in srgb,var(--a) 2%,#050506);
  --bg2:color-mix(in srgb,var(--a) 5%,#0a0a0c);
  --card:color-mix(in srgb,var(--a) 4%,#111114);
  --txt:#f4f2f7; --mut:#a8a2b6; --fgr:255,255,255; --line:rgba(var(--fgr),.09);
}
[data-modo="claro"]{
  --bg:color-mix(in srgb,var(--a) 4%,#faf9fc);
  --bg2:color-mix(in srgb,var(--a) 8%,#f1eff6);
  --card:#ffffff;
  --txt:#1a1722; --mut:#6a6479; --fgr:20,16,34; --line:rgba(var(--fgr),.11);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:calc(16px*var(--fs))}
body{background:var(--bg);color:var(--txt);font-family:var(--fb);line-height:1.6;overflow-x:hidden;transition:background .5s,color .3s}
h1,h2,h3,.logo{font-family:var(--fh);line-height:1.1;letter-spacing:-.02em}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
section{padding:110px 0;position:relative}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{display:block;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--b);margin-bottom:14px;font-weight:700}
h2{font-size:clamp(2rem,4.5vw,3.2rem);margin-bottom:16px}
.lead{color:var(--mut);max-width:620px;font-size:1.08rem}
.center{text-align:center}.center .lead{margin:0 auto}

#glow{position:fixed;width:520px;height:520px;border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle,color-mix(in srgb,var(--a) 20%,transparent),transparent 62%);transform:translate(-50%,-50%);left:50%;top:30%}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--grad);z-index:100}

nav{position:fixed;top:0;left:0;right:0;z-index:50;transition:.3s}
nav.sc{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:72px;gap:16px}
.logo{font-size:1.4rem;font-weight:700;display:flex;align-items:center;gap:10px}
.logo i{display:flex;gap:2px;align-items:center;height:22px}
.logo i b{display:block;width:3px;border-radius:2px;background:var(--grad);animation:eq 1.1s ease-in-out infinite}
.logo i b:nth-child(1){height:10px}.logo i b:nth-child(2){height:20px;animation-delay:.15s}
.logo i b:nth-child(3){height:14px;animation-delay:.3s}.logo i b:nth-child(4){height:18px;animation-delay:.45s}
@keyframes eq{50%{transform:scaleY(.35)}}
.links{display:flex;gap:24px;align-items:center;font-size:.93rem;color:var(--mut)}
.links a:hover{color:var(--txt)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:var(--rb);font-weight:600;border:0;cursor:pointer;
  font-size:1rem;font-family:inherit;transition:transform .2s,box-shadow .2s,background .2s;position:relative;justify-content:center}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--grad);color:var(--on);box-shadow:0 8px 30px -8px color-mix(in srgb,var(--a) 75%,transparent)}
.btn.p:hover{box-shadow:0 12px 40px -6px color-mix(in srgb,var(--b) 65%,transparent)}
.btn.g{background:rgba(var(--fgr),.06);border:1px solid var(--line);color:var(--txt)}
.btn.g:hover{background:rgba(var(--fgr),.12)}
.btn.sm{padding:10px 20px;font-size:.9rem}
.burger{display:none;background:none;border:0;color:var(--txt);font-size:1.7rem;cursor:pointer}
.sel{background:rgba(var(--fgr),.06);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:8px 12px;font:inherit;font-size:.85rem;cursor:pointer;outline:none}
.sel option{background:var(--card);color:var(--txt)}
.pbtn{display:inline-flex;align-items:center;gap:8px;background:rgba(var(--fgr),.06);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:8px 14px 8px 8px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
.pbtn i{width:22px;height:22px;border-radius:50%;background:var(--grad);display:block}
.pbtn:hover{background:rgba(var(--fgr),.12)}

#hero{min-height:100vh;min-height:100svh;display:flex;align-items:center;padding-top:110px;overflow:hidden}
#net{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#hero .wrap{position:relative;z-index:2;text-align:center;width:100%;min-width:0}
.pill{display:inline-flex;gap:10px;align-items:center;padding:8px 18px;border:1px solid var(--line);border-radius:999px;
  background:rgba(var(--fgr),.05);font-size:.88rem;color:var(--mut);margin-bottom:28px}
.pill span{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 12px #34d399;animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.35}}
h1{font-size:clamp(2.1rem,7vw,5.4rem);margin-bottom:24px;overflow-wrap:break-word}
#typed{border-right:3px solid var(--b);padding-right:4px;animation:caret .8s steps(1) infinite}
@keyframes caret{50%{border-color:transparent}}
#hero .lead{margin:0 auto 38px;font-size:1.2rem}
.cta{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.wave{display:flex;gap:5px;justify-content:center;align-items:center;height:60px;margin-top:70px}
.wave b{width:5px;border-radius:3px;background:var(--grad);height:12px;animation:wv 1.4s ease-in-out infinite;opacity:.85}
@keyframes wv{50%{height:56px}}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:-40px;position:relative;z-index:3}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px;text-align:center}
.stat strong{font-family:var(--fh);font-size:2.6rem;display:block}
.stat span{color:var(--mut);font-size:.92rem}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:56px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:34px;position:relative;overflow:hidden;
  transition:transform .15s,border-color .3s,background .5s;transform-style:preserve-3d;will-change:transform}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(380px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--a) 24%,transparent),transparent 60%);opacity:0;transition:.3s;pointer-events:none}
.card:hover::before{opacity:1}.card:hover{border-color:color-mix(in srgb,var(--a) 55%,transparent)}
.ico{width:54px;height:54px;border-radius:calc(var(--r)*.75);background:var(--grad);display:grid;place-items:center;font-size:1.5rem;margin-bottom:22px;position:relative}
.card h3{font-size:1.35rem;margin-bottom:10px;position:relative}
.card p{color:var(--mut);font-size:.98rem;position:relative}

#demo{background:linear-gradient(180deg,var(--bg),var(--bg2),var(--bg))}
.demo{display:grid;grid-template-columns:340px minmax(0,1fr);gap:36px;margin-top:40px;align-items:start}
.opts{display:flex;flex-direction:column;gap:12px}
.namebox{margin-bottom:6px}
.namebox label{display:block;font-size:.8rem;font-weight:600;color:var(--mut);margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em}
.inp{width:100%;background:rgba(var(--fgr),.05);border:1px solid var(--line);border-radius:calc(var(--r)*.6);padding:14px 16px;color:var(--txt);font:inherit;outline:none;transition:.25s}
.inp:focus{border-color:var(--b);box-shadow:0 0 0 4px color-mix(in srgb,var(--b) 16%,transparent)}
textarea.inp{min-height:100px;resize:vertical}
select.inp option{background:var(--card);color:var(--txt)}
.opt{display:flex;gap:14px;align-items:center;padding:14px 18px;border-radius:calc(var(--r)*.8);background:var(--card);border:1px solid var(--line);
  color:var(--txt);cursor:pointer;font:inherit;text-align:left;transition:.25s}
.opt:hover{transform:translateX(6px)}
.opt.on{border-color:var(--a);background:linear-gradient(90deg,color-mix(in srgb,var(--a) 20%,var(--card)),var(--card))}
.opt em{font-style:normal;font-size:1.6rem}
.opt small{display:block;color:var(--mut);font-size:.82rem}
.quick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:.85rem;color:var(--mut)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;background:linear-gradient(135deg,var(--s1),var(--s2));outline:2px solid transparent;outline-offset:2px;transition:transform .2s}
.sw:hover{transform:scale(1.15)}
.sw[aria-pressed="true"]{outline-color:var(--txt)}
.browser{border-radius:calc(var(--r)*.9);border:1px solid var(--line);background:var(--bg2);overflow:hidden;box-shadow:0 40px 90px -30px rgba(0,0,0,.6),0 0 80px -30px var(--a);transition:box-shadow .5s,background .5s}
.bbar{display:flex;gap:8px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--card)}
.bbar i{width:11px;height:11px;border-radius:50%;background:rgba(var(--fgr),.2)}
.bbar i:nth-child(1){background:#ff5f57}.bbar i:nth-child(2){background:#febc2e}.bbar i:nth-child(3){background:#28c840}
.url{margin-left:14px;flex:1;background:var(--bg);border-radius:8px;padding:6px 14px;font-size:.8rem;color:var(--mut);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.site{padding:34px;min-height:430px}
.s-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:46px;font-size:.85rem;color:var(--mut);gap:12px}
.s-nav b{font-family:var(--fh);font-size:1.1rem;color:var(--a)}
.s-nav span{display:flex;gap:18px}
.s-hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center}
.s-hero h4{font-family:var(--fh);font-size:clamp(1.5rem,3vw,2.3rem);line-height:1.1;margin-bottom:12px}
.s-hero p{color:var(--mut);font-size:.92rem;margin-bottom:20px}
.s-btn{display:inline-block;padding:11px 22px;border-radius:var(--rb);background:var(--grad);color:var(--on);font-weight:600;font-size:.88rem}
.s-img{aspect-ratio:1;border-radius:var(--r);background:linear-gradient(135deg,var(--a),transparent 85%);display:grid;place-items:center;font-size:5rem;animation:flt 4s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-10px) rotate(2deg)}}
.s-feat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:34px}
.s-feat div{padding:14px;border-radius:calc(var(--r)*.6);background:rgba(var(--fgr),.05);font-size:.8rem;border:1px solid var(--line);text-align:center}
.fade{animation:fd .5s}
@keyframes fd{from{opacity:0;transform:translateY(8px)}}
.note{text-align:center;margin-top:18px;color:var(--mut);font-size:.9rem}

.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:60px;position:relative}
.steps::before{content:"";position:absolute;top:34px;left:8%;right:8%;height:2px;background:var(--line)}
.steps::after{content:"";position:absolute;top:34px;left:8%;height:2px;width:var(--prog,0%);background:var(--grad);max-width:84%;transition:width .3s}
.step{text-align:center;position:relative;z-index:1}
.num{width:68px;height:68px;border-radius:50%;background:var(--bg);border:2px solid var(--line);display:grid;place-items:center;
  margin:0 auto 20px;font-family:var(--fh);font-size:1.4rem;font-weight:700;transition:.4s}
.step.on .num{border-color:var(--b);box-shadow:0 0 28px color-mix(in srgb,var(--b) 55%,transparent);color:var(--b)}
.step h3{font-size:1.15rem;margin-bottom:8px}.step p{color:var(--mut);font-size:.92rem}

.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:56px;align-items:stretch}
.plan{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:36px;display:flex;flex-direction:column;position:relative;transition:transform .3s,outline-color .3s,background .5s;outline:2px solid transparent;outline-offset:5px}
.plan:hover{transform:translateY(-8px)}
.plan.rec{outline-color:var(--b)}
.plan.hot{border:1px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,var(--grad) border-box;box-shadow:0 30px 80px -30px color-mix(in srgb,var(--a) 65%,transparent)}
.plan .badge{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--grad);color:var(--on);padding:4px 16px;border-radius:99px;font-size:.78rem;font-weight:700;white-space:nowrap}
.plan .pe{font-size:2rem;margin-bottom:8px}
.plan h3{font-size:1.5rem}.plan .d{color:var(--mut);font-size:.92rem;margin:6px 0 22px;min-height:2.9em}
.price{font-family:var(--fh);font-size:3rem;font-weight:700;line-height:1}
.price small{font-size:.9rem;font-weight:500;color:var(--mut);font-family:var(--fb)}
.plan ul{list-style:none;margin:24px 0 30px;display:grid;gap:12px;font-size:.95rem;flex:1}
.plan li::before{content:"✓";color:var(--b);font-weight:700;margin-right:10px}
.fine{color:var(--mut);font-size:.85rem;margin-top:26px;text-align:center}

.quiz{margin-top:56px;display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center}
.quiz h3{font-size:1.6rem;margin-bottom:6px}
.needs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.need{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:calc(var(--r)*.6);cursor:pointer;font-size:.92rem;background:rgba(var(--fgr),.03);transition:.2s;user-select:none}
.need:hover{border-color:var(--b)}
.need.on{border-color:var(--a);background:color-mix(in srgb,var(--a) 14%,transparent)}
.need input{display:none}
.need i{width:20px;height:20px;border-radius:6px;border:2px solid var(--mut);display:grid;place-items:center;flex-shrink:0;font-style:normal;font-size:.75rem;color:var(--on);transition:.2s}
.need.on i{background:var(--grad);border-color:transparent}
.res{text-align:center;padding:10px}
.res .big{font-family:var(--fh);font-size:2.4rem;font-weight:700;margin:6px 0}
.res p{color:var(--mut);margin-bottom:16px}

.faq{max-width:780px;margin:50px auto 0;display:grid;gap:12px}
.qa{background:var(--card);border:1px solid var(--line);border-radius:calc(var(--r)*.8);overflow:hidden}
.qa button{width:100%;background:none;border:0;color:var(--txt);font:inherit;font-weight:600;font-size:1.05rem;padding:22px 26px;display:flex;justify-content:space-between;cursor:pointer;text-align:left;gap:20px}
.qa button span{color:var(--b);transition:.3s;font-size:1.4rem;line-height:1}
.qa.on button span{transform:rotate(45deg)}
.qa div{max-height:0;overflow:hidden;transition:max-height .4s;color:var(--mut);padding:0 26px}
.qa.on div{padding-bottom:22px}

.box{background:linear-gradient(135deg,color-mix(in srgb,var(--a) 18%,transparent),color-mix(in srgb,var(--b) 10%,transparent)),var(--card);border:1px solid var(--line);border-radius:calc(var(--r)*1.4);padding:60px;
  display:grid;grid-template-columns:1fr 1fr;gap:50px;position:relative;overflow:hidden}
.box::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:var(--a);filter:blur(140px);opacity:.14;right:-120px;top:-120px;pointer-events:none}
form{display:grid;gap:14px;position:relative;z-index:1}
.box h2{font-size:clamp(1.8rem,3.4vw,2.6rem)}
.perks{list-style:none;margin:26px 0;display:grid;gap:12px;color:var(--mut);position:relative;z-index:1}
.perks li::before{content:"✦";color:var(--b);margin-right:10px}
.phone{max-width:320px;border-radius:24px;overflow:hidden;border:6px solid color-mix(in srgb,var(--txt) 85%,transparent);background:#efeae2;position:relative;z-index:1}
.ptop{background:#075E54;color:#fff;padding:.65rem .9rem;display:flex;align-items:center;gap:.6rem;font-size:.9rem;font-weight:600}
.ptop .av{width:30px;height:30px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:700;font-size:.7rem;color:var(--on)}
.chat{padding:.9rem .7rem;min-height:170px;display:grid;align-content:start;gap:.45rem}
.bub{max-width:92%;padding:.5rem .7rem;border-radius:12px;border-top-right-radius:3px;font-size:.82rem;line-height:1.4;background:#dcf8c6;color:#111;justify-self:end;white-space:pre-wrap;animation:fd .3s}
.bub .t{display:block;text-align:right;font-size:.65rem;color:#667;margin-top:.1rem}
.bub.in{background:#fff;justify-self:start;border-top-right-radius:12px;border-top-left-radius:3px}
.typing{display:inline-flex;gap:3px;padding:.15rem 0}.typing i{width:6px;height:6px;border-radius:50%;background:#99a;animation:ty 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{40%{transform:translateY(-4px);opacity:.5}}

footer{border-top:1px solid var(--line);padding:40px 0 90px;color:var(--mut);font-size:.9rem}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px}
.wa{position:fixed;right:22px;bottom:22px;z-index:60;width:58px;height:58px;border-radius:50%;background:#25d366;display:grid;place-items:center;font-size:1.7rem;
  box-shadow:0 10px 30px rgba(37,211,102,.5);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.6)}70%{box-shadow:0 0 0 20px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
.toast{position:fixed;left:50%;bottom:24px;background:var(--txt);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:600;z-index:120;transition:transform .3s,visibility .3s;visibility:hidden;transform:translate(-50%,200%);max-width:calc(100% - 32px);text-align:center}
.toast.show{visibility:visible;transform:translate(-50%,0)}

/* ---- Panel de personalización ---- */
.fabp{position:fixed;left:22px;bottom:22px;z-index:60;display:flex;align-items:center;gap:10px;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:10px 18px 10px 10px;font:inherit;font-weight:600;font-size:.9rem;cursor:pointer;box-shadow:0 12px 34px -10px rgba(0,0,0,.5)}
.fabp i{width:34px;height:34px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-style:normal;color:var(--on);font-size:1rem;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fabp.hint::after{content:"";position:absolute;inset:-6px;border-radius:999px;border:2px solid var(--b);animation:pulse2 1.8s infinite;pointer-events:none}
@keyframes pulse2{0%{transform:scale(.95);opacity:.9}100%{transform:scale(1.12);opacity:0}}

const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const root=document.documentElement;
const fmtP=i=>'$'+String(CONFIG.precios[i]).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let LANG='es';
const t=k=>(T[LANG]&&T[LANG][k]!==undefined)?T[LANG][k]:T.es[k];
const toast=(()=>{let h;return m=>{const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(h);h=setTimeout(()=>e.classList.remove('show'),2600)}})();

const PRESETS=[['#e11d2e','#ff4d4d'],['#7c5cff','#22d3ee'],['#2563eb','#06b6d4'],['#16a34a','#a3e635'],['#f97316','#facc15'],['#ec4899','#8b5cf6'],['#0d9488','#38bdf8'],['#b45309','#fbbf24']];
const FONTS={moderna:["'Space Grotesk',Inter,sans-serif","Inter,system-ui,sans-serif"],elegante:["'Playfair Display',Georgia,serif","Lora,Georgia,serif"],amigable:["Poppins,system-ui,sans-serif","Nunito,system-ui,sans-serif"],tecnica:["'Space Mono',monospace","'Space Mono',monospace"]};
const FKEYS=Object.keys(FONTS);
const SHAPES={sq:['6px','6px'],soft:['14px','12px'],round:['20px','999px']};
const NEG_E=[['🍦','🍨'],['🍽️','🍝'],['🛍️','👟'],['🩺','🦷'],['💪','🏋️']];

/* ---------- estado y color ---------- */
let S={...CONFIG.inicial};
try{const g=JSON.parse(localStorage.getItem('sx-estado2')||'null');if(g)S={...S,...g}}catch(e){}
if(S.anim==='on')S.anim='dyn';
const save=()=>{try{localStorage.setItem('sx-estado2',JSON.stringify(S))}catch(e){}};
const hex2rgb=h=>{h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16))};
const lum=h=>{const [r,g,b]=hex2rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b};
function hsl2hex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')}
let AR='225,29,46',BR='255,77,77';
function aplicar(){
  root.style.setProperty('--a',S.a);root.style.setProperty('--b',S.b);
  root.style.setProperty('--on',(lum(S.a)+lum(S.b))/2>.45?'#15121a':'#ffffff');
  AR=hex2rgb(S.a).join(',');BR=hex2rgb(S.b).join(',');
  root.dataset.modo=S.modo;root.dataset.anim=S.anim;
  const f=FONTS[S.fuente]||FONTS.moderna;root.style.setProperty('--fh',f[0]);root.style.setProperty('--fb',f[1]);
  root.style.setProperty('--fs',S.tam/100);
  const sh=SHAPES[S.forma]||SHAPES.round;root.style.setProperty('--r',sh[0]);root.style.setProperty('--rb',sh[1]);
  $('#c1').value=S.a;$('#c2').value=S.b;$('#fszv').textContent=S.tam+'%';$('#fsz').value=S.tam;
  $$('#sws .sw,#qsw .sw').forEach(b=>b.setAttribute('aria-pressed',b.dataset.a===S.a&&b.dataset.b===S.b));
  $$('#segMode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.modo));
  $$('#segShape button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.forma));
  $$('#segAnim button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.anim));
  $$('#fonts button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.fuente));
  save();
}

/* ---------- idioma ---------- */
function setIdioma(l,guardar){
  if(!T[l])l='es';LANG=l;S.idioma=l;root.lang=l;$('#lang').value=l;
  document.title=t('meta.title');
  $$('[data-t]').forEach(e=>e.innerHTML=t(e.dataset.t));
  $$('[data-tp]').forEach(e=>e.placeholder=t(e.dataset.tp));
  $$('[data-brand]').forEach(e=>e.textContent=CONFIG.marca);
  renderSvcs();renderSteps();renderPlans();renderFaq();renderNeeds();renderRes();renderDemoOpts();renderSelects();paintDemo(false);chat();renderMq();window.paintDots&&paintDots();
  $$('[data-n]').forEach(n=>{if(n.closest('.rv.in'))setCount(n,+n.dataset.n)});
  renderFontsPanel();renderTyped(true);
  if(guardar)save();
}
function setCount(n,v){const u=n.dataset.u;const unit=u&&u.startsWith('u.')?t(u):(u||'');n.textContent=(n.dataset.n.includes('.')?v.toFixed(1).replace('.',','):Math.round(v))+unit}

/* ---------- render dinámico ---------- */
function renderSvcs(){$('#svcs').innerHTML=t('sv.list').map((s,i)=>`<div class="card si" style="--i:${i}"><div class="ico">${s[0]}</div><h3>${s[1]}</h3><p>${s[2]}</p></div>`).join('');bindTilt()}
function renderSteps(){$('#steps').innerHTML=t('pr.list').map((s,i)=>`<div class="step si" style="--i:${i}"><div class="num">${i+1}</div><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join('');onScroll()}
let REC=-1;
function renderPlans(){
  $('#plans').innerHTML=t('pl.list').map((p,i)=>`<div class="plan si ${i===1?'hot':''} ${REC===i?'rec':''}" style="--i:${i}" data-i="${i}">${i===1?`<div class="badge">${t('pl.badge')}</div>`:''}
   <div class="pe">${p.e}</div><h3>${p.n}</h3><div class="d">${p.d}</div>
   <div class="price">${fmtP(i)}<small> ${CONFIG.moneda}${t('pl.mo')}</small></div>
   <ul>${p.f.map(x=>`<li>${x}</li>`).join('')}</ul>
   <button class="btn ${i===1?'p':'g'}" data-pick="${i}">${t('pl.pick')}</button></div>`).join('');
}
function renderFaq(){const l=$('#faq-list');l.innerHTML=t('fq.list').map((f,i)=>`<div class="qa si" style="--i:${i}"><button>${f[0]}<span>+</span></button><div>${f[1]}</div></div>`).join('');
  $$('.qa',l).forEach(q=>q.firstElementChild.onclick=()=>{const on=q.classList.contains('on');
    $$('.qa',l).forEach(x=>{x.classList.remove('on');x.lastElementChild.style.maxHeight=0});
    if(!on){q.classList.add('on');q.lastElementChild.style.maxHeight=q.lastElementChild.scrollHeight+30+'px'}})}
const TIER=[0,1,2,2,2,2,2];const NEEDS=new Set();
function renderNeeds(){$('#needs').innerHTML=t('qz.needs').map((n,i)=>`<label class="need si ${NEEDS.has(i)?'on':''}" style="--i:${i}" data-i="${i}"><input type="checkbox" ${NEEDS.has(i)?'checked':''}><i>${NEEDS.has(i)?'✓':''}</i>${n}</label>`).join('')}
function renderRes(){
  const box=$('#res');
  if(!NEEDS.size){REC=-1;box.innerHTML=`<div style="font-size:3rem">🤔</div><p>${t('qz.none')}</p>`}
  else{REC=Math.max(...[...NEEDS].map(i=>TIER[i]));const p=t('pl.list')[REC];
    box.innerHTML=`<div style="font-size:3rem">${p.e}</div><p>${t('qz.rec')}</p><div class="big grad">${p.n}</div><p><b style="color:var(--txt)">${fmtP(REC)} ${CONFIG.moneda}</b> ${t('pl.mo')}</p><button class="btn p" data-pick="${REC}">${t('qz.btn')}</button>`}
  $$('#plans .plan').forEach((c,i)=>c.classList.toggle('rec',i===REC));
}
function renderSelects(){
  const tp=$('#f-t'),pk=$('#f-p'),a=tp.selectedIndex,b=pk.selectedIndex;
  tp.innerHTML=t('neg').map(n=>`<option>${n.k}</option>`).join('')+`<option>${t('ct.other')}</option>`;
  pk.innerHTML=t('pl.list').map((p,i)=>`<option value="${i}">${t('ct.pkg')} ${p.n} · ${fmtP(i)} ${CONFIG.moneda}${t('pl.mo')}</option>`).join('')+`<option value="-1">${t('ct.unsure')}</option>`;
  tp.selectedIndex=a<0?0:a;pk.selectedIndex=b<0?1:b;
}
function renderMq(){const L=t('mq').concat(t('mq')).map(x=>`<span>${x}</span>`).join('');$('#mq').innerHTML=L+L}
function renderFontsPanel(){const nm=t('pn.f');$('#fonts').innerHTML=FKEYS.map((k,i)=>`<button data-v="${k}" aria-pressed="${S.fuente===k}"><b style="font-family:${FONTS[k][0]}">Aa</b><small>${nm[i]}</small></button>`).join('')}

/* ---------- demo ---------- */
let curNeg=0;
function renderDemoOpts(){$('#opts').innerHTML=t('neg').map((n,i)=>`<button class="opt ${i===curNeg?'on':''}" data-i="${i}"><em>${NEG_E[i][0]}</em><div><strong>${n.k}</strong><small>${n.s}</small></div></button>`).join('')}

/* ---------- chat WhatsApp en vivo ---------- */
function msg(){
  const n=$('#f-n').value.trim(),b=$('#f-b').value.trim(),tp=$('#f-t').value;
  const pi=+$('#f-p').value,pk=pi>=0?`${t('ct.pkg')} ${t('pl.list')[pi].n} (${fmtP(pi)} ${CONFIG.moneda}${t('pl.mo')})`:t('ct.unsure');
  return t('msg.t').replace('{n}',n||t('msg.name')).replace('{b}',b?` · "${b}"`:'').replace('{tp}',tp).replace('{pk}',pk).replace('{m}',$('#f-m').value.trim()||t('msg.def'));
}
function chat(){const h=new Date().toLocaleTimeString(LANG,{hour:'2-digit',minute:'2-digit'});
  $('#chat').innerHTML=`<div class="bub">${esc(msg())}<span class="t">${h} ✓✓</span></div><div class="bub in"><span class="typing"><i></i><i></i><i></i></span></div>`}

/* ---------- texto que se escribe ---------- */
let typedTimer,tw=0,tc=0,td=false;
function renderTyped(reset){if(reset){tw=0;tc=0;td=false}clearTimeout(typedTimer);const el=$('#typed');
  (function step(){const W=t('hero.words'),word=W[tw%W.length];el.textContent=word.slice(0,tc);
    if(!td&&tc>=word.length){td=true;typedTimer=setTimeout(step,1600);return}
    if(td&&tc<=0){td=false;tw=(tw+1)%W.length}
    tc+=td?-1:1;typedTimer=setTimeout(step,td?45:95)})()}

/* ---------- panel ---------- */
(()=>{
  const mk=(h,cls)=>PRESETS.map(p=>`<button class="sw" style="--s1:${p[0]};--s2:${p[1]}" data-a="${p[0]}" data-b="${p[1]}" aria-label="${p[0]}" aria-pressed="false"></button>`).join('');
  $('#sws').innerHTML=mk();$('#qsw').innerHTML=PRESETS.slice(0,6).map(p=>`<button class="sw" style="--s1:${p[0]};--s2:${p[1]};width:26px;height:26px" data-a="${p[0]}" data-b="${p[1]}" aria-label="${p[0]}" aria-pressed="false"></button>`).join('');
  const setCol=(a,b)=>{S.a=a;S.b=b;aplicar()};
  document.addEventListener('click',e=>{const s=e.target.closest('.sw');if(s)setCol(s.dataset.a,s.dataset.b)});

  $('#rand').onclick=()=>{const h=Math.random()*360;setCol(hsl2hex(h,78,50),hsl2hex((h+35+Math.random()*60)%360,88,58))};
  $('#segMode').onclick=e=>{const b=e.target.closest('button');if(b){S.modo=b.dataset.v;aplicar()}};
  $('#segShape').onclick=e=>{const b=e.target.closest('button');if(b){S.forma=b.dataset.v;aplicar()}};

  $('#fonts').onclick=e=>{const b=e.target.closest('button');if(b){S.fuente=b.dataset.v;aplicar();renderFontsPanel()}};

  $('#reset').onclick=()=>{const l=LANG;S={...CONFIG.inicial,idioma:l};aplicar();renderFontsPanel();toast(t('to.reset'))};

$('#yr').textContent=new Date().getFullYear();
$('#burger').onclick=()=>$('#links').classList.toggle('open');
$$('#links a').forEach(a=>a.onclick=()=>$('#links').classList.remove('open'));

/* ---------- scroll, progreso, brillo ---------- */
const nav=$('#nav'),bar=$('#bar'),glow=$('#glow');
function onScroll(){
  nav.classList.toggle('sc',scrollY>20);
  bar.style.width=(scrollY/Math.max(1,document.body.scrollHeight-innerHeight)*100)+'%';
  const st=$('#steps').getBoundingClientRect();
  const p=Math.min(1,Math.max(0,(innerHeight*.75-st.top)/st.height));
  $('#steps').style.setProperty('--prog',(p*100)+'%');
  $$('.step').forEach((s,i)=>s.classList.toggle('on',p>i/4+.05));
}
addEventListener('scroll',onScroll,{passive:true});
addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;glow.style.left=e.clientX+'px';glow.style.top=e.clientY+'px'},{passive:true});
(()=>{const w=$('#wave');for(let i=0;i<42;i++){const b=document.createElement('b');b.style.animationDelay=(i*0.07)+'s';b.style.animationDuration=(1+Math.abs(Math.sin(i))*.9)+'s';w.appendChild(b)}})();

/* red de partículas */
(()=>{const cv=$('#net'),x=cv.getContext('2d');let W,H,P=[],m={x:-999,y:-999};
  const rs=()=>{W=cv.width=cv.offsetWidth;H=cv.height=cv.offsetHeight;P=Array.from({length:Math.min(110,W/12|0)},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4}))};
  rs();addEventListener('resize',rs);
  cv.parentElement.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const r=cv.getBoundingClientRect();m.x=e.clientX-r.left;m.y=e.clientY-r.top});
  cv.parentElement.addEventListener('pointerleave',()=>m.x=m.y=-999);
  (function f(){x.clearRect(0,0,W,H);const off=S.anim==='off';
    for(const p of P){const dx=p.x-m.x,dy=p.y-m.y,d=Math.hypot(dx,dy);
      if(!off){if(d<140){p.x+=dx/d*1.6;p.y+=dy/d*1.6}p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1}
      x.fillStyle=`rgba(${AR},.9)`;x.beginPath();x.arc(p.x,p.y,1.8,0,7);x.fill()}
    for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const d=Math.hypot(P[i].x-P[j].x,P[i].y-P[j].y);
      if(d<130){x.strokeStyle=`rgba(${AR},${.3*(1-d/130)})`;x.beginPath();x.moveTo(P[i].x,P[i].y);x.lineTo(P[j].x,P[j].y);x.stroke()}}
    if(!off)for(const p of P){const d=Math.hypot(p.x-m.x,p.y-m.y);if(d<170){x.strokeStyle=`rgba(${BR},${.6*(1-d/170)})`;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(m.x,m.y);x.stroke()}}
    requestAnimationFrame(f)})();})();

/* revelar al hacer scroll + contadores */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;e.target.classList.add('in');io.unobserve(e.target);
  $$('[data-n]',e.target).forEach(n=>{const to=+n.dataset.n,t0=performance.now();(function u(tt){const p=Math.min(1,(tt-t0)/1500);setCount(n,to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(u)})(t0)})
}),{threshold:.15});
$$('.rv').forEach((e,i)=>{e.style.animationDelay=(i%3)*.1+'s';io.observe(e)});$$('.stg').forEach(e=>io.observe(e));

/* inclinación 3D */
function bindTilt(){$$('.card:not([data-tilt])').forEach(c=>{c.dataset.tilt=1;
  c.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const r=c.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
    c.style.setProperty('--mx',px*100+'%');c.style.setProperty('--my',py*100+'%');
    if(c.classList.contains('quiz'))return;
    c.style.transform=`perspective(800px) rotateX(${(.5-py)*8}deg) rotateY(${(px-.5)*8}deg) translateY(-4px)`});
  c.addEventListener('pointerleave',()=>c.style.transform='')})}

/* ---------- movimiento entre secciones ---------- */
(()=>{
  const secIds=['hero','servicios','demo','proceso','planes','faq','contacto'];
  const navKeys=['nav.home','nav.serv','nav.demo','nav.proc','nav.plans','nav.faq','nav.cta'];
  $$('#hero .wrap > *').forEach((e,i)=>{e.classList.add('hi');e.style.setProperty('--i',i)});
  /* ecualizador entre secciones: crece al entrar y se pausa al salir */
  const eqIO=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('in',e.isIntersecting)),{threshold:.1});
  ['demo','proceso','planes','faq','contacto'].forEach((id,k)=>{const s=$('#'+id),d=document.createElement('div');
    d.className='eqd';d.setAttribute('aria-hidden','true');
    d.innerHTML=Array.from({length:40},(_,i)=>{const h=Math.max(.14,(.3+.7*Math.abs(Math.sin(i*.55+k)))*(1-Math.abs(i-19.5)/26));
      return `<i style="--h:${h.toFixed(2)};--du:${(0.9+Math.abs(Math.cos(i*1.7))*.9).toFixed(2)}s;--dl:${(i*0.04).toFixed(2)}s"></i>`}).join('');
    s.prepend(d);eqIO.observe(d)});
  /* esferas de color con parallax suave */
  const orbs=[];
  ['servicios','demo','planes','contacto'].forEach((id,k)=>{const s=$('#'+id),w=document.createElement('div');w.className='orbs';w.setAttribute('aria-hidden','true');
    const L=k%2;
    w.innerHTML=`<div class="orb" data-s=".12" style="${L?'right':'left'}:-140px;top:6%"></div><div class="orb" data-s="-.09" style="--c1:var(--b);${L?'left':'right'}:-120px;bottom:4%;width:300px;height:300px"></div>`;
    s.prepend(w);$$('.orb',w).forEach(o=>orbs.push({o,s,sp:+o.dataset.s}))});
  let tick=false;
  const par=()=>{tick=false;if(S.anim==='off')return;const vh=innerHeight;
    orbs.forEach(({o,s,sp})=>{const r=s.getBoundingClientRect();if(r.bottom<-200||r.top>vh+200)return;o.style.transform=`translate3d(0,${((r.top+r.height/2)-vh/2)*sp}px,0)`})};
  addEventListener('scroll',()=>{if(!tick){tick=true;requestAnimationFrame(par)}},{passive:true});par();
  /* puntos laterales + subrayado del menú según la sección */
  let cur='hero';
  const mark=id=>{cur=id;$$('#dots a').forEach(a=>a.classList.toggle('act',a.dataset.id===id));$$('#links a[href^="#"]').forEach(a=>a.classList.toggle('act',a.getAttribute('href')==='#'+id))};
  window.paintDots=()=>{$('#dots').innerHTML=secIds.map((id,i)=>`<a href="#${id}" data-id="${id}" aria-label="${t(navKeys[i])}"><span>${t(navKeys[i])}</span></a>`).join('');mark(cur)};
  const spy=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)mark(e.target.id)}),{rootMargin:'-45% 0px -50% 0px'});
  secIds.forEach(id=>spy.observe($('#'+id)));
})();

/* ---------- arranque ---------- */
(()=>{aplicar();setIdioma(S.idioma||'es',false);onScroll()})();
</script>
</body>
</html>
